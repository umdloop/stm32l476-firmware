name: Continuous integration pipeline

on:
  push:
    branches:
      - main
      - gpio_system
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: STM32CubeIDE build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4.2.2

      - name: Determine short GIT hash
        id: short-sha
        run: |
          echo "sha=${GITHUB_SHA::10}" >> "$GITHUB_OUTPUT"

      - name: Patch CubeIDE pre-build command for Linux CI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(".cproject")
          s = p.read_text()

          s = s.replace(
              '&quot;${workspace_loc:/${ProjName}}/tools/prebuild_dbc_to_c.bat&quot;',
              'python3 &quot;${workspace_loc:/${ProjName}}/tools/dbc_to_c.py&quot; &quot;${workspace_loc:/${ProjName}}/App/dbc/4.13.2026.dbc&quot; &quot;${workspace_loc:/${ProjName}}/App/dbc/can_dbc_text.c&quot; --no-install-dbc'
          )

          s = s.replace(
              '"${workspace_loc:/${ProjName}}/tools/prebuild_dbc_to_c.bat"',
              'python3 "${workspace_loc:/${ProjName}}/tools/dbc_to_c.py" "${workspace_loc:/${ProjName}}/App/dbc/4.13.2026.dbc" "${workspace_loc:/${ProjName}}/App/dbc/can_dbc_text.c" --no-install-dbc'
          )

          p.write_text(s)
          PY

      - name: Build the firmware binary
        uses: xanderhendriks/action-build-stm32cubeide@v17.0
        with:
          project-path: '.'
          project-target: 'stm32l476-firmware/Debug'
          stm32cubeide-version: '2.1.1'

      - name: Verify build succeeded
        run: |
          if [ ! -f Debug/stm32l476-firmware.elf ]; then
            echo "Build failed: Debug/stm32l476-firmware.elf not found"
            exit 1
          fi

          echo "Build verified:"
          ls -lh Debug/stm32l476-firmware.elf

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4.6.1
        with:
          name: stm32l476-firmware-${{ steps.short-sha.outputs.sha }}
          if-no-files-found: warn
          path: |
            Debug/stm32l476-firmware.elf
            Debug/stm32l476-firmware.bin
            Debug/stm32l476-firmware.map
            Debug/stm32l476-firmware.list
